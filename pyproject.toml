[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-backlog-assistant"
version = "1.0.0"
description = "Microsoft Agent Framework assistant for turning requirements into backlog proposals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core==1.13.0",
    "agent-framework-openai==1.12.0",
    "pydantic>=2.11,<3",
    "pypdf>=5.4,<7",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
smart-backlog = "smart_backlog_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
